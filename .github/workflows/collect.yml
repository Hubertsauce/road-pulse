name: Collect road sentiment

on:
  schedule:
    - cron: "*/15 * * * *"   # elke 15 minuten (GitHub kan wat later starten)
  workflow_dispatch:          # knop "Run workflow" om handmatig te testen

permissions:
  contents: write             # nodig om de nieuwe data terug te committen

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, analyse, store
        run: python collect.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Geen nieuwe data."
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
