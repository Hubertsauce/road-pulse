name: Collect road sentiment

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect every 10 minutes for 5.5 hours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            python collect.py || echo "collect.py failed, trying again next round"
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git pull --rebase || echo "pull failed"
              git push || echo "push failed"
            fi
            sleep 600
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main --repo ${{ github.repository }}
